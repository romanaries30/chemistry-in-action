<script>
let TCH=false;
const L=[
{k:"Lesson 1",t:"Ionic, covalent, and metallic bonding",comp:"Describe ionic, covalent, and metallic bonding",mps:"79.17%",
obj:"By the end of this lesson, you can describe how ionic, covalent, and metallic bonds form and tell them apart using the types of atoms involved.",
body:`<p>Atoms bond to reach a more stable arrangement of <b>valence electrons</b> (the electrons in the outermost shell). How they do it depends on what kind of atoms meet.</p>
<div class="grid3">
<div class="t i"><h3>Ionic bond</h3><p><b>Metal + nonmetal.</b> The metal <b>transfers</b> electrons to the nonmetal. This makes a positive ion (cation) and a negative ion (anion) that attract each other.</p><p>Example: NaCl</p></div>
<div class="t c"><h3>Covalent bond</h3><p><b>Nonmetal + nonmetal.</b> Atoms <b>share</b> pairs of electrons, forming molecules.</p><p>Example: H₂O, CO₂</p></div>
<div class="t m"><h3>Metallic bond</h3><p><b>Metal + metal.</b> Metal atoms release outer electrons into a "sea" that moves freely around the positive metal ions.</p><p>Example: Cu, Fe</p></div></div>
<svg viewBox="0 0 640 150" role="img" aria-label="Diagrams: electron transfer, electron sharing, and a sea of electrons around metal ions" font-family="Lexend,sans-serif" font-size="13">
<g fill="none" stroke-width="2"><circle cx="45" cy="70" r="26" stroke="var(--ion)"/><circle cx="125" cy="70" r="26" stroke="var(--ion)"/></g>
<text x="45" y="75" text-anchor="middle" fill="var(--ion)">Na</text><text x="125" y="75" text-anchor="middle" fill="var(--ion)">Cl</text>
<path d="M75 52 Q85 38 95 52" stroke="var(--ion)" stroke-width="2" fill="none"/><text x="85" y="30" text-anchor="middle" fill="var(--ion)">e⁻ moves</text><text x="85" y="130" text-anchor="middle" fill="var(--ion)">Na⁺  Cl⁻</text>
<g fill="none" stroke="var(--cov)" stroke-width="2"><circle cx="265" cy="70" r="30"/><circle cx="315" cy="70" r="30"/></g>
<circle cx="290" cy="62" r="4" fill="var(--cov)"/><circle cx="290" cy="78" r="4" fill="var(--cov)"/><text x="290" y="30" text-anchor="middle" fill="var(--cov)">shared pair</text><text x="290" y="130" text-anchor="middle" fill="var(--cov)">H₂</text>
<g fill="var(--met)" font-size="14"><text x="440" y="50">+</text><text x="490" y="50">+</text><text x="540" y="50">+</text><text x="440" y="100">+</text><text x="490" y="100">+</text><text x="540" y="100">+</text>
<circle cx="465" cy="72" r="3"/><circle cx="515" cy="75" r="3"/><circle cx="460" cy="115" r="3"/><circle cx="520" cy="45" r="3"/><circle cx="565" cy="78" r="3"/><circle cx="420" cy="78" r="3"/></g>
<text x="490" y="140" text-anchor="middle" fill="var(--met)">metal ions in an electron sea</text></svg>
<div class="ex"><b>Quick test.</b> Look at the periodic table. Metal + nonmetal → ionic. Nonmetal + nonmetal → covalent. Metal + metal → metallic.</div>
<p><b>Why do they stick together?</b> In ionic bonds, opposite charges attract. In covalent bonds, the nuclei of both atoms attract the shared electrons. In metallic bonds, the positive ions are held by the attraction to the sea of electrons.</p>`,
q:[["What happens to electrons in an ionic bond?",["They are shared equally","They are transferred from one atom to another","They are lost to the air","They stay in the nucleus"],1,"Ionic bonding is electron transfer. That is why ions form."],
["Which pair of atoms will form a covalent bond?",["Na and Cl","Cu and Zn","C and O","Mg and F"],2,"Carbon and oxygen are both nonmetals, so they share electrons."],
["In metallic bonding, what is the “sea of electrons”?",["Electrons stuck between two atoms","Free-moving electrons shared by all the metal ions","Extra neutrons in the metal","Negative ions in a crystal"],1,"The outer electrons are delocalized, meaning they are not tied to one atom."],
["MgCl₂ is made of magnesium (a metal) and chlorine (a nonmetal). What type of bond does it have?",["Ionic","Covalent","Metallic","None of these"],0,"Metal + nonmetal gives an ionic bond."]]},
{k:"Lesson 2",t:"Writing chemical formulas",comp:"Write the chemical formulas of ionic and covalent compounds",mps:"78.10%",
obj:"By the end of this lesson, you can write the formula of an ionic compound from ion charges and of a covalent compound from its name.",
body:`<h2>A. Ionic compounds: criss-cross the charges</h2>
<p>The total charge must be zero. Write the cation first, then the anion. Use the number of each ion's charge as the subscript of the <i>other</i> ion, then reduce to the lowest ratio.</p>
<div class="scroll"><table><tr><th>Ions</th><th>Criss-cross</th><th>Formula</th></tr>
<tr><td>Na⁺ and Cl⁻</td><td>1 and 1</td><td class="f">NaCl</td></tr>
<tr><td>Mg²⁺ and Cl⁻</td><td>Mg gets 1, Cl gets 2</td><td class="f">MgCl₂</td></tr>
<tr><td>Al³⁺ and O²⁻</td><td>Al gets 2, O gets 3</td><td class="f">Al₂O₃</td></tr>
<tr><td>Ca²⁺ and O²⁻</td><td>Ca₂O₂ reduces to 1 : 1</td><td class="f">CaO</td></tr></table></div>
<div class="ex"><b>Common mistake.</b> Do not leave unreduced ratios. Mg²⁺ and O²⁻ give <b>MgO</b>, not Mg₂O₂. Also, never write the charges inside the final formula.</div>
<h2>B. Covalent compounds: use the prefixes</h2>
<p>The prefix in the name tells you how many atoms of each element are in one molecule. A first element with one atom gets no “mono-.”</p>
<div class="scroll"><table><tr><th>1</th><th>2</th><th>3</th><th>4</th><th>5</th><th>6</th></tr><tr><td>mono-</td><td>di-</td><td>tri-</td><td>tetra-</td><td>penta-</td><td>hexa-</td></tr></table></div>
<div class="ex"><b>Examples</b><br>carbon dioxide → <span class="f">CO₂</span><br>carbon tetrachloride → <span class="f">CCl₄</span><br>diphosphorus pentoxide → <span class="f">P₂O₅</span></div>`,
q:[["What is the formula of calcium chloride? (Ca²⁺ and Cl⁻)",["CaCl","Ca₂Cl","CaCl₂","Ca₂Cl₂"],2,"Ca has a 2+ charge, so it needs two Cl⁻ ions to balance."],
["Al³⁺ and O²⁻ form which compound?",["AlO","Al₂O₃","Al₃O₂","Al₂O₂"],1,"Criss-cross the charges: Al gets 2, O gets 3."],
["Write the formula for sulfur trioxide.",["S₃O","SO₃","S₃O₃","SO"],1,"“Tri-” goes with oxygen. Sulfur has no prefix, so it has one atom."],
["Which is the correct formula for magnesium oxide?",["Mg₂O₂","Mg₂O","MgO₂","MgO"],3,"Mg²⁺ and O²⁻ balance 1 : 1, so the ratio is reduced to MgO."]]},
{k:"Lesson 3",t:"Properties of substances and their bonds",comp:"Explain the properties of pure substances based on the nature of chemical bonds",mps:"77.33%",
obj:"By the end of this lesson, you can explain why ionic, covalent, and metallic substances have different melting points, conductivity, and hardness.",
body:`<p>The way particles are held together decides how a substance behaves. Always link the <b>property</b> to the <b>bond</b>.</p>
<div class="scroll"><table><tr><th>Property</th><th style="color:var(--ion)">Ionic (NaCl)</th><th style="color:var(--cov)">Covalent (sugar, water)</th><th style="color:var(--met)">Metallic (Cu)</th></tr>
<tr><td>Melting point</td><td>High</td><td>Low</td><td>Usually high</td></tr>
<tr><td>Conducts electricity</td><td>Only when molten or dissolved</td><td>Poorly or not at all</td><td>Yes, even as a solid</td></tr>
<tr><td>Hardness</td><td>Hard but brittle</td><td>Soft, liquid, or gas</td><td>Malleable and ductile</td></tr></table></div>
<h2>The reasons</h2>
<div class="grid3">
<div class="t i"><h3>Ionic</h3><p>Ions form a rigid lattice held by strong attraction between opposite charges, so a lot of heat is needed to melt it. In a solid, ions cannot move, so there is no conduction. When melted or dissolved, ions are free to carry charge. If a layer shifts, like charges line up and repel, so the crystal cracks.</p></div>
<div class="t c"><h3>Covalent</h3><p>The bonds inside a molecule are strong, but the forces <i>between</i> molecules are weak. Melting or boiling only separates the molecules, so the melting point is low. There are no free ions or electrons, so these substances do not conduct.</p></div>
<div class="t m"><h3>Metallic</h3><p>Free electrons carry current, so metals conduct as solids. Layers of metal ions can slide while the electron sea keeps holding them together, so metals bend and stretch without breaking.</p></div></div>
<div class="ex"><b>Try the claim–reason pattern.</b> “Salt has a high melting point <i>because</i> its oppositely charged ions attract strongly in a lattice.” A good answer always has the word “because.”</div>`,
